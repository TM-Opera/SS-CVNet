# Train the full model (using the defaults from this config file):
# python train.py --config configs/SS-CVNet.yaml
#
# background run:
# nohup python train.py --config configs/SS-CVNet.yaml > /dev/null 2>&1 &

# Override config parameters via the command line:
# python train.py --config configs/SS-CVNet.yaml --set model.ablation.use_center_circle_mask true
#
# background run:
# nohup python train.py --config configs/SS-CVNet.yaml --set model.ablation.use_center_circle_mask true > /dev/null 2>&1 &

# Use only specific cities:
# python train.py --config configs/SS-CVNet.yaml --cities Adelaide San_Francisco
#
# background run:
# nohup python train.py --config configs/SS-CVNet.yaml --cities Adelaide San_Francisco > /dev/null 2>&1 &

# =====================================================================
# Module 2 ablation options in detail
# =====================================================================

# 1. Center circular mask (use_center_circle_mask)
#    Pros: no pre-computed mask needed, simple and efficient, highly interpretable
#    Cons: ignores edge information, assumes the capture position is at the center
#    Parameter tuning:
#      - circle_mask_radius: circular radius (pixels)
#        * small images (64×64): 20-30
#        * medium images (128×128): 40-60 (50 recommended)
#        * large images (256×256): 80-120
#
#    usage example:
#    python train.py --config configs/SS-CVNet.yaml --set model.ablation.use_center_circle_mask true --set model.ablation.circle_mask_radius 50
#
#    background run:
#    nohup python train.py --config configs/SS-CVNet.yaml --set model.ablation.use_center_circle_mask true --set model.ablation.circle_mask_radius 50 > /dev/null 2>&1 &

# 2. SEBlock attention (use_se_attention)
#    Pros: learned attention, adaptive channel weights, few parameters (+512)
#    Cons: channel-level rather than pixel-level, requires training
#    Parameter tuning:
#      - se_reduction: reduction ratio (default 16)
#        * 8: stronger attention capacity, slightly more parameters
#        * 16: balances performance and efficiency (recommended)
#        * 32: fewest parameters, slightly lower performance
#
#    usage example:
#    python train.py --config configs/SS-CVNet.yaml --set model.ablation.use_se_attention true --set model.module2.se_reduction 16
#
#    background run:
#    nohup python train.py --config configs/SS-CVNet.yaml --set model.ablation.use_se_attention true --set model.module2.se_reduction 16 > /dev/null 2>&1 &

# =====================================================================
# Module 3 ablation options in detail
# =====================================================================

# 1. Polar transformation (use_polar_transform)
#    Pros: based on geometric priors, no pre-computed M_geo needed, physically interpretable
#    Cons: assumes center capture, may not fully match the real view
#    Parameter tuning:
#      - polar_output_size: [height, width]
#        * [32, 256]: low resolution, fast training
#        * [128, 256]: medium resolution, balances speed and accuracy (recommended)
#        * [256, 512]: high resolution, best accuracy
#
#    usage example:
#    python train.py --config configs/SS-CVNet.yaml \
#        --set model.ablation.use_polar_transform true \
#        --set model.ablation.polar_output_size "[128, 256]"

# 2. Learnable matrix (use_learnable_matrix)
#    Pros: data-driven, adaptively learned, captures complex relationships
#    Cons: many parameters (+65K), may overfit, needs more data
#    Parameter tuning:
#      - sat_resolution: satellite image resolution [H, W]
#        * should match the actual data size
#        * affects the parameter count of the learnable matrix
#
#    usage example:
#    python train.py --config configs/SS-CVNet.yaml \
#        --set model.ablation.use_learnable_matrix true \
#        --set model.ablation.sat_resolution "[128, 128]"

# =====================================================================
# Data split modes in detail
# =====================================================================

# Mode 1: random ratio split (default)
# =====================================================================
# Use cases:
#   - Sufficient data, a random split is desired
#   - City-level differences are not a concern
#   - Maximize training data utilization
#
# Configuration:
#   data:
#     cities: all                    # use all cities
#     val_cities: null               # or simply omit this parameter
#     train_split: 0.8
#     val_split: 0.2
#
# Effect:
#   - Data from all cities is shuffled randomly
#   - 80% of samples become the training set
#   - 20% of samples become the validation set
#
# usage example:
# python train.py --config configs/SS-CVNet.yaml

# Mode 2: split by city (Leave-One-City-Out)
# =====================================================================
# Use cases:
#   - Test cross-city generalization of the model
#   - Leave-One-City-Out (LOCO) validation
#   - Some cities serve as test sets (unseen cities)
#
# Configuration:
#   data:
#     cities: all                    # use all cities
#     val_cities: ['San_Francisco']  # specify validation cities
#     # train_split and val_split are ignored
#
# Effect:
#   - All samples of San_Francisco become the validation set
#   - Samples of the remaining 32 cities become the training set
#   - Strict city-level split, no data leakage
#
# usage example:
# python train.py --config configs/SS-CVNet.yaml --set data.val_cities "['San_Francisco']"
#
# background run:
# nohup python train.py --config configs/SS-CVNet.yaml --set data.val_cities "['San_Francisco']" > /dev/null 2>&1 &
#
# or set it in the config file:
# data:
#   val_cities: ['San_Francisco']

# Multi-city validation set example:
# =====================================================================
# Scenario: validate on multiple cities
# python train.py --config configs/SS-CVNet.yaml --set data.val_cities "['San_Francisco', 'Chicago', 'Boston']"
#
# background run:
# nohup python train.py --config configs/SS-CVNet.yaml --set data.val_cities "['San_Francisco', 'Chicago', 'Boston']" > /dev/null 2>&1 &
#
# Effect:
#   - San_Francisco, Chicago, Boston become the validation set
#   - The remaining 30 cities become the training set

# Specified city subset + city split:
# =====================================================================
# Scenario: train on only a few cities and hold one out for validation
# python train.py --config configs/SS-CVNet.yaml --set data.cities "['Adelaide', 'San_Francisco', 'Chicago']" --set data.val_cities "['San_Francisco']"
#
# background run:
# nohup python train.py --config configs/SS-CVNet.yaml --set data.cities "['Adelaide', 'San_Francisco', 'Chicago']" --set data.val_cities "['San_Francisco']" > /dev/null 2>&1 &
#
# Effect:
#   - Training set: Adelaide, Chicago
#   - Validation set: San_Francisco
#
# note: val_cities must be a subset of cities!

# Full Leave-One-City-Out experiment:
# =====================================================================
# Use each city as the validation set in turn, training 33 models
#
# for city in Adelaide Atlanta Austin Boston Chicago ...; do
#   python train.py --config configs/SS-CVNet.yaml \
#     --set data.val_cities "['$city']" \
#     --set exp_name loco_${city}
# done

