# =====================================================================
# Common configuration templates
# =====================================================================

# Template 1: standard training (all cities, random split)
# data:
#   cities: all
#   train_split: 0.8
#   val_split: 0.2
#   val_cities: null

# Template 2: Leave-One-City-Out (single validation city)
# data:
#   cities: all
#   val_cities: ['San_Francisco']
#   # train_split and val_split are ignored

# Template 3: regional validation (multiple validation cities)
# data:
#   cities: all
#   val_cities: ['San_Francisco', 'Chicago', 'Boston']
#   # North American cities as the validation set

# Template 4: specified training cities + specified validation city
# data:
#   cities: ['Adelaide', 'Atlanta', 'Austin', 'Boston']
#   val_cities: ['Boston']
#   # training: Adelaide, Atlanta, Austin
#   # validation: Boston

# Template 5: quick experiment (few cities)
# data:
