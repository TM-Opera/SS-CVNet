# =====================================================================
# Notes and FAQ
# =====================================================================

# 1. val_cities rules
#    - val_cities must be a subset of cities
#    - if cities=all, val_cities can be any city list
#    - if cities specifies a subset, val_cities must be within that subset
#    - val_cities=null or unset: ratio split mode is used
#    - val_cities=[]: empty list, equivalent to null, ratio split mode is used
#
# 2. Data volume check
#    - City splits may cause training/validation imbalance
#    - Check the sample counts per city first
#    - If a validation city has too few samples, consider choosing multiple cities
#
# 3. City name spelling
#    - City names must match the dataset spelling exactly
#    - Check all available cities in the dataset first
#    - Common mistakes: inconsistent casing, typos
#
# 4. Compatibility
#    - This configuration is fully backward compatible with the original logic
#    - If val_cities is unset, the original train_split/val_split is used
#    - Existing training scripts run without modification
#
# 5. Implementation notes (for developers)
#    - The data loader must detect the val_cities parameter
#    - If val_cities is not null/empty, city split mode is enabled
#    - If val_cities is null/empty, ratio split mode is used
