# SS-CVNet training configuration
# VIFE depth-aware fusion + ablation option support

# =====================================================================
# Experiment identification
# =====================================================================
# Experiment naming convention: sscvnet_{feature_description}
#
# Naming rules:
# 1. Basic format: sscvnet_{configuration description}
# 2. Descriptive naming that clearly expresses the experiment configuration
# 3. Use underscores to separate multiple features
# 4. Avoid abbreviations (unless very common)
#
# Common naming examples:
# =============
# Module 2 mask options:
# - sscvnet_visibility      # original visibility mask (full baseline)
# - sscvnet_circle50        # center circular mask (radius 50 pixels)
# - sscvnet_circle30        # center circular mask (radius 30 pixels)
# - sscvnet_se16            # SEBlock attention (reduction ratio 16)
# - sscvnet_se8             # SEBlock attention (reduction ratio 8)
# - sscvnet_nomask          # no mask
#
# Module 3 alignment options:
# - sscvnet_polar           # polar transformation
# - sscvnet_learned         # learnable matrix
# - sscvnet_noalignment     # no cross-view alignment
#
# Combined experiments:
# - sscvnet_polar_se16      # polar transformation + SEBlock
# - sscvnet_learned_circle50  # learnable matrix + center circular mask
#
# Data split experiments:
# - sscvnet_val_tokyo       # Tokyo as the validation set (single city)
# - sscvnet_val_usa         # US cities as the validation set
# - sscvnet_val_europe      # European cities as the validation set
#
# nohup python train.py --config configs/SS-CVNet.yaml > /dev/null 2>&1 &

exp_name: sscvnet

# For backward compatibility with train.py
exp:
  model_name: sscvnet
  version: v1
  output_root: Parameter

# Random seed
seed: 42

# Device configuration
device: cuda:0

# =====================================================================
# Data configuration
# =====================================================================
data:
  # Data paths
  csv_path: data2/processed/multi_view.csv       #  data2/processed/complete_mapping_data_clean3.csv
  feature_root: data2/processed/patches_merged                     #  data2/processed/fisheye.csv
                                                                   #  data2/processed/multi_view.csv
  perspective: multi_view

  # Modalities to use
  modalities:
    - rgb                      # or use rsi
    - building_height
    - tree_height

  # =================================================================
  # Data split modes (two modes, choose one)
  # =================================================================

  # Mode 1: random ratio split (default mode)
  # - Randomly splits the data of all cities into training and validation sets by ratio
  # - Use case: sufficient data, a random split is desired
  train_split: 0.8              # training set ratio (0.8 means 80%)
  val_split: 0.2                # validation set ratio (0.2 means 20%)

  # Mode 2: split by city (Leave-One-City-Out or custom validation set)
  # - Automatically enabled when val_cities is set
  # - The cities specified by val_cities become the validation set
  # - The remaining cities become the training set
  # - train_split and val_split are ignored in this mode
  # - Use case: cross-city generalization tests, Leave-One-City-Out validation
  val_cities: null              # validation city list; null means Mode 1
                                # example 1: ['San_Francisco']  # single validation city
                                # example 2: ['San_Francisco', 'Chicago']  # multiple validation cities
                                # example 3: []  # empty list means Mode 1

  # Overall city selection (applies to both modes)
  cities: all                   # all: use all 33 cities
                                # or a subset: ['Adelaide', 'San_Francisco', 'Chicago']
                                # note: val_cities must be a subset of cities

  # Data loader configuration
  batch_size: 256
  target_size: [128, 128]
  num_workers: 8
  pin_memory: true
  shuffle: true

  # Use pre-generated masks (required)
  use_generated_masks: true
  use_npz_format: true

# =====================================================================
# Model configuration - SS-CVNet
# =====================================================================
model:
  # Architecture type
  architecture_type: sscvnet

  # Ablation option configuration
  ablation:
    # Module 1: semantic embedding
    use_semantic_embedding: true    # whether to use semantic embedding

    # Module 2: VIFE ablation options
    use_height_map: true            # whether to use height maps (building_height + tree_height)
    use_visibility_mask: true       # whether to use the pre-computed visibility mask
    use_center_circle_mask: false   # Module 2 option 1: use a center circular mask instead of the visibility mask
    circle_mask_radius: 50          # center circular mask radius (pixels)
    use_se_attention: false         # Module 2 option 2: use SEBlock attention instead of the visibility mask

    # Module 3: cross-view alignment ablation options
    use_cross_view_alignment: true  # whether to use cross-view alignment
    use_polar_transform: false      # Module 3 option 1: use polar transformation instead of M_geo
    polar_output_size: [128, 256]   # polar transformation output size [height, width]
    use_learnable_matrix: false     # Module 3 option 2: use a learnable matrix instead of M_geo
    sat_resolution: [128, 128]      # satellite image resolution (used by the learnable matrix)

    # Module 3 fusion strategy (Section 4.3.3), applied to the semantic/texture fusion
    # inside the cross-view alignment module (used when use_cross_view_alignment=true)
    fusion_strategy: gate           # 'gate' (default): per-channel gating
                                    # 'rsc': Raw-Semantic Concat + 1×1 conv projection
                                    # 'cma': window-based multi-head cross-modal attention
                                    # 'ssi': element-wise addition + 1×1 conv projection

  # Module 2: VIFE depth-aware self-attention
  module2:
    lambda_weight: 0.8              # depth similarity weight coefficient
    use_window_attention: true      # whether to use window attention
    window_size: 4                  # window size
    se_reduction: 2                 # SEBlock reduction ratio (only effective when use_se_attention=true)

  # Module 4: backbone (BackboneEncoder)
  module4:
    backbone_type: resnet50         # resnet18/34/50/101, convnext_tiny/small/base
                                    # note: must match the backbone used at training time
                                    # resnet50 was used for training; do not change it

  # Module 5: classification prediction
  module5:
    hidden_dim: 512
    dropout_p: 0.2

# =====================================================================
# Training configuration
# =====================================================================
train:
  # Basic training parameters
  epochs: 100
  lr: 0.003
  early_stopping_patience: 100
  use_weighted_loss: false
  label_weights: [1.0, 0.8, 1.5]

  # Optimizer configuration
  optimizer: adamw
  weight_decay: 0.0002

# =====================================================================
# Evaluation configuration
# =====================================================================
eval:
  # Task type
  task_type: regression

  # Evaluation metrics
  metrics:
    - mse
    - mae
    - rmse
    - r2

  # Model selection strategy
  best_metric: val_ALL_r2
  best_mode: max

  # Validation interval
  val_interval: 1

# =====================================================================
# Logging configuration
# =====================================================================
logging:
  console_level: INFO
  log_interval: 1

